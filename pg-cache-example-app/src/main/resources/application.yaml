spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pgcache
    driverClassName: org.postgresql.Driver
    username: pgcache-admin
    #password:

pg-cache:
  enabled: true
  custom-serializers: false # switch to true to test custom serializer
  table-name: cache_data1
  default-ttl-seconds: 30
  cleanup-enabled: true
  cleanup-limit: 10
  cleanup-cron: "*/10 * * * * *"
  caches:
    cache1:
      ttl-seconds: 5
    cache2:
      disabled: true # switch to false to test

  async:
    enabled: true
    writeThreads: 3
    clearThreads: 2

